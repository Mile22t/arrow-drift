name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'dist/**', '.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arrow-drift.p12"
          chmod 600 "$RUNNER_TEMP/arrow-drift.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/arrow-drift.p12" >> "$GITHUB_ENV"
      - name: Install build platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify puzzle rules
        run: |
          node verify.cjs
          node verify-runs.cjs
          node verify-race.cjs
          node verify-touch.cjs
      - name: Build and lint APK
        working-directory: android
        run: gradle :app:assembleRelease :app:assembleReleaseAndroidTest :app:lintRelease --stacktrace
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/release/app-release.apk
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/ArrowDrift.apk
          sha256sum apk/ArrowDrift.apk > apk/SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ArrowDrift-Android-APK
          path: apk/
          if-no-files-found: error
      - name: Stop build daemon before emulator
        run: gradle --stop
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test offline game in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -feature -Vulkan
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            adb install -r apk/ArrowDrift.apk
            adb install -r "$(find android/app/build/outputs/apk/androidTest/release -name '*.apk' -print -quit)"
            adb shell am instrument -w -r com.mile22t.arrowdrift.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation-results.txt
            grep -q 'OK (1 test)' instrumentation-results.txt
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell am start -n com.mile22t.arrowdrift/.MainActivity
            sleep 3
            adb exec-out screencap -p > android-smoke.png
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArrowDrift-Android-Tests
          path: |
            android/app/build/reports/
            android-smoke.png
            instrumentation-results.txt


