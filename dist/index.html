<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f0"><title>Arrow Drift — 8 × 8 × 16 Time Trial</title><link rel="stylesheet" href="voxel.css"></head><body><header><a class="brand" href="./"><span>↗</span> arrow drift <small>3D</small></a></header><main><section class="game"><div class="game-top"><div><h2 id="level">Hard time trial</h2></div><div class="race-times"><span>TIME <strong id="timer">00:00.0</strong></span><span>HARD MODE BEST <strong id="best">—</strong></span></div></div><div class="progress"><div id="progress"></div></div><div class="viewport"><canvas id="canvas" aria-label="3D mixed-piece puzzle. Drag to rotate; tap a piece to remove it." tabindex="0"></canvas><span class="dimension" id="dimension"></span></div><div class="view-controls"><button id="left" aria-label="Rotate left">↶</button><button id="up" aria-label="Rotate upward">↑</button><button id="home" aria-label="Reset view">◇</button><button id="down" aria-label="Rotate downward">↓</button><button id="right" aria-label="Rotate right">↷</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomIn" aria-label="Zoom in">+</button></div><div class="race-actions"><button id="startTimer">Start timer</button><button id="shuffle">⤨ Shuffle · 5/5</button></div><div class="bottom"><button id="restart">⤨ &nbsp; New random puzzle</button><span id="remaining"></span><button id="hint">✧ &nbsp; Hint</button></div><p id="status" role="status"></p><div class="accessible"><label for="cubeSelect">Keyboard play</label><select id="cubeSelect" aria-label="Select a piece"></select><button id="release">Release piece</button></div></section></main><dialog id="modal"><div class="eyebrow" id="resultLabel"></div><h2 id="result"></h2><p id="resultText"></p><button id="continue">Race again</button></dialog><script src="puzzle.js"></script><script src="game.js"></script></body></html>
