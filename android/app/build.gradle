plugins { id 'com.android.application' }

android {
    namespace 'com.mile22t.arrowdrift'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mile22t.arrowdrift'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        persistent {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storeType 'PKCS12'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'arrowdrift'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.persistent
            minifyEnabled false
        }
    }
    testBuildType System.getenv('ANDROID_KEYSTORE_FILE') ? 'release' : 'debug'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig = true }
    sourceSets { main { assets.srcDirs = ['../../dist'] }; androidTest { assets.srcDirs = ['../../android-tests'] } }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
